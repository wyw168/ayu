<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿育｜美股・加密貨幣・派卡</title>
<meta name="description" content="阿育的連結頁：派卡註冊、免費交流群、客服小編、每日美股分享。">
<meta property="og:title" content="阿育｜美股・加密貨幣・派卡">
<meta property="og:description" content="派卡註冊看電影買一送一、免費交流群、每日美股分享">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #F6F6F3;
    --card: #FFFFFF;
    --line: #E7E7E2;
    --ink: #16181D;
    --muted: #6E727A;
    --up: #E5484D;      /* 台股習慣：紅漲 */
    --down: #2FA36B;    /* 綠跌 */
    --flame: #FF8A3D;
    --grid: rgba(22,24,29,.06);
    --feature-bg: #16181D;
    --feature-ink: #FFFFFF;
    --feature-muted: rgba(255,255,255,.66);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --orange-1: #FFA040;
    --orange-2: #FF6A1F;
    --club: #06C755;     /* LINE 綠 */
    --club-soft: #7BE3A8;
    --club-bg: #F0FBF5;
    --glow: rgba(255,138,61,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0F12;
      --card: #17191D;
      --line: #26292F;
      --ink: #F2F2EF;
      --muted: #9196A0;
      --grid: rgba(255,255,255,.06);
      --feature-bg: #F2F2EF;
      --feature-ink: #16181D;
      --feature-muted: rgba(22,24,29,.62);
      --shadow: none;
      --club-bg: #12241A;
      --glow: rgba(255,138,61,.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  /* ---------- 動態背景 ---------- */
  #bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  body::before {
    content: ""; position: fixed; z-index: 0; pointer-events: none;
    width: 520px; height: 520px; border-radius: 50%;
    top: -220px; right: -180px;
    background: radial-gradient(closest-side, var(--glow), transparent);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    to { transform: translate(-120px, 160px) scale(1.15); }
  }
  main {
    position: relative; z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ---------- 圖表 ---------- */
  .chart {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
  }
  .chart canvas { display: block; width: 100%; height: 190px; }
  .chart-meta {
    position: absolute; top: 12px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
  .chart-meta b {
    font-variant-numeric: tabular-nums;
    font-weight: 600; color: var(--up); font-size: 13px;
  }
  .chart-meta b.neg { color: var(--down); }
  .ticker { font-weight: 600; letter-spacing: .04em; color: var(--ink); }
  .hint {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted); pointer-events: none;
    transition: opacity .4s;
  }
  .toast {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 22px; font-weight: 700; color: var(--ink);
    opacity: 0; transform: scale(.96); transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: scale(1); }

  /* ---------- 個人 ---------- */
  .profile { text-align: center; margin: 22px 0 22px; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%;
    margin: 0 auto 10px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-size: 30px; font-weight: 700;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile h1 { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .profile p { font-size: 14px; color: var(--muted); margin-top: 2px; }

  /* ---------- 連結 ---------- */
  .label {
    font-size: 12px; color: var(--muted); letter-spacing: .08em;
    margin: 22px 4px 10px;
  }
  .links { display: grid; gap: 10px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: inherit; text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  .link:hover { border-color: var(--muted); }
  .link:active { transform: scale(.985); }
  .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
  }
  .icon svg { width: 22px; height: 22px; }
  .text { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; }
  .sub { font-size: 13px; color: var(--muted); }
  .arrow { flex: none; color: var(--muted); }
  .arrow svg { width: 18px; height: 18px; display: block; }

  .links { gap: 12px; }
  .link { position: relative; }

  /* 進場：由下往上依序浮現 */
  .link { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  .links .link:nth-child(2) { animation-delay: .08s; }
  .links .link:nth-child(3) { animation-delay: .16s; }
  .links .link:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .link:hover { transform: translateY(-2px); }

  /* 派卡註冊：橘色大按鈕＋流光 */
  .link.feature {
    overflow: hidden;
    padding: 22px 18px;
    border: none;
    background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
    color: #fff;
    box-shadow: 0 8px 24px rgba(255,106,31,.32);
  }
  .link.feature .title { font-size: 19px; font-weight: 700; }
  .link.feature .sub { color: rgba(255,255,255,.9); font-size: 14px; }
  .link.feature .arrow { color: #fff; }
  .link.feature .arrow svg { width: 22px; height: 22px; animation: nudge 1.6s ease-in-out infinite; }
  .link.feature .icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.22); color: #fff; }
  .link.feature .icon svg { width: 26px; height: 26px; }
  .link.feature .badge { background: #fff; color: var(--orange-2); }
  .link.feature::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @keyframes nudge { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -3px); } }

  /* 阿育免費交流群：LINE 綠＋旋轉邊框＋擴散光圈 */
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .link.club {
    border: 2px solid transparent;
    background:
      linear-gradient(var(--club-bg), var(--club-bg)) padding-box,
      conic-gradient(from var(--a), var(--club), var(--club-soft), var(--club) 35%, #fff 50%, var(--club) 65%, var(--club-soft), var(--club)) border-box;
    animation: rise .55s cubic-bezier(.2,.8,.2,1) .08s both, spin 4s linear infinite;
  }
  .link.club::after {
    content: ""; position: absolute; inset: -2px; border-radius: 16px;
    pointer-events: none;
    animation: halo 2.2s ease-out infinite;
  }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes halo {
    0%   { box-shadow: 0 0 0 0 rgba(6,199,85,.45); }
    100% { box-shadow: 0 0 0 14px rgba(6,199,85,0); }
  }
  .link.club .icon { background: var(--club); color: #fff; }
  .link.club .arrow { color: var(--club); }
  .link.club .badge { background: var(--club); }

  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    font-size: 11px; font-weight: 600; border-radius: 999px;
    background: var(--flame); color: #fff; vertical-align: 2px;
  }

  .link.disabled { opacity: .5; pointer-events: none; box-shadow: none; }

  footer {
    text-align: center; font-size: 12px; color: var(--muted);
    margin-top: 32px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .toast, .hint { transition: none; }
    .link, .link.club, .link::after, .link .arrow svg, body::before { animation: none !important; }
  }
</style>

<script>
(() => {
  const TARGET = 50;              // 漲到 +50% 火箭起飛
  const VISIBLE = 20;             // 畫面上顯示幾根 K 棒
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const chart = document.getElementById('chart');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const pctEl = document.getElementById('pct');
  const launchEl = document.getElementById('launches');
  const hint = document.getElementById('hint');
  const toast = document.getElementById('toast');

  let launches = 0;
  try { launches = parseInt(localStorage.getItem('ayu-launches') || '0', 10) || 0; } catch (e) {}
  launchEl.textContent = `起飛 ${launches} 次`;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let colors = {};
  const readColors = () => colors = {
    up: css('--up'), down: css('--down'), grid: css('--grid'),
    ink: css('--ink'), card: css('--card'), flame: css('--flame'), muted: css('--muted')
  };
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readColors);

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 資料 ----------
  let base, candles, anim, flight;
  function seed() {
    base = 100;
    candles = [];
    let p = 100;
    for (let i = 0; i < 14; i++) {
      const o = p;
      const c = o * (1 + (Math.random() - .45) * .03);
      candles.push(mk(o, c));
      p = c;
    }
    base = candles[candles.length - 1].c;
    anim = null; flight = null;
    updatePct();
  }
  function mk(o, c) {
    const hi = Math.max(o, c) * (1 + Math.random() * .008);
    const lo = Math.min(o, c) * (1 - Math.random() * .008);
    return { o, c, h: hi, l: lo };
  }
  const last = () => candles[candles.length - 1];
  const gain = () => (last().c / base - 1) * 100;

  function updatePct() {
    const g = gain();
    pctEl.textContent = (g >= 0 ? '+' : '') + g.toFixed(1) + '%';
    pctEl.classList.toggle('neg', g < 0);
  }

  // ---------- 互動 ----------
  function tap() {
    if (flight) return;
    hint.style.opacity = '0';
    const o = last().c;
    const up = Math.random() < .85;
    const c = up ? o * (1 + .025 + Math.random() * .035) : o * (1 - .005 - Math.random() * .015);
    const k = mk(o, c);
    candles.push(k);
    if (candles.length > 60) candles.shift();
    anim = { k, t0: performance.now(), dur: reduced ? 0 : 260 };
    updatePct();
    if (gain() >= TARGET) launch();
  }
  chart.addEventListener('click', tap);
  chart.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); }
  });

  function launch() {
    flight = { t0: performance.now() + 250 };
    launches++;
    try { localStorage.setItem('ayu-launches', String(launches)); } catch (e) {}
    launchEl.textContent = `起飛 ${launches} 次`;
    setTimeout(() => toast.classList.add('show'), 500);
    setTimeout(() => {
      toast.classList.remove('show');
      seed();
    }, 2000);
  }

  // ---------- 繪圖 ----------
  function drawRocket(x, y, angle, scale, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(scale, scale);
    // 火焰
    const f = reduced ? 1 : 0.8 + Math.sin(t / 60) * 0.2;
    ctx.fillStyle = colors.flame;
    ctx.beginPath();
    ctx.moveTo(-4, 9); ctx.quadraticCurveTo(0, 9 + 12 * f, 4, 9); ctx.closePath();
    ctx.fill();
    // 尾翼
    ctx.fillStyle = colors.up;
    ctx.beginPath(); ctx.moveTo(-5, 2); ctx.lineTo(-10, 10); ctx.lineTo(-5, 8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(5, 2); ctx.lineTo(10, 10); ctx.lineTo(5, 8); ctx.closePath(); ctx.fill();
    // 機身
    ctx.fillStyle = colors.ink;
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.bezierCurveTo(7, -8, 6, 4, 5, 9);
    ctx.lineTo(-5, 9);
    ctx.bezierCurveTo(-6, 4, -7, -8, 0, -14);
    ctx.fill();
    // 窗
    ctx.fillStyle = colors.card;
    ctx.beginPath(); ctx.arc(0, -3, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);

    const padL = 14, padR = 46, padT = 40, padB = 34;
    const view = candles.slice(-VISIBLE);
    // 動畫中的最後一根
    let p = 1;
    if (anim) {
      p = anim.dur ? Math.min(1, (t - anim.t0) / anim.dur) : 1;
      p = 1 - Math.pow(1 - p, 3);
      if (p >= 1) anim = null;
    }
    const shown = view.map((k, i) => {
      if (anim && k === anim.k) {
        const c = k.o + (k.c - k.o) * p;
        return { o: k.o, c, h: Math.max(k.o, c, k.o + (k.h - k.o) * p), l: Math.min(k.o, c, k.o + (k.l - k.o) * p) };
      }
      return k;
    });

    let lo = Infinity, hi = -Infinity;
    shown.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
    const span = (hi - lo) || 1;
    lo -= span * .08; hi += span * .08;
    const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);

    // 格線
    ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const gy = Math.round(padT + i * (H - padT - padB) / 3) + .5;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padL, gy); ctx.stroke();
    }

    // K 棒
    const slot = (W - padL - padR) / VISIBLE;
    const bw = Math.max(4, slot * .56);
    const offset = VISIBLE - shown.length;
    shown.forEach((k, i) => {
      const cx = padL + (i + offset + .5) * slot;
      const col = k.c >= k.o ? colors.up : colors.down;
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(cx, y(k.h)); ctx.lineTo(cx, y(k.l)); ctx.stroke();
      const top = y(Math.max(k.o, k.c)), bot = y(Math.min(k.o, k.c));
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx - bw / 2, top, bw, Math.max(1.5, bot - top), 1.5)
                    : ctx.rect(cx - bw / 2, top, bw, Math.max(1.5, bot - top));
      ctx.fill();
    });

    // 火箭：停在最後一根收盤價右側
    const lk = shown[shown.length - 1];
    const rx = padL + (VISIBLE + .5) * slot + 12;
    let ry = y(lk.c);
    let rAngle = Math.PI / 5, rScale = 1;
    let fx = rx, fy = ry;
    if (flight && t > flight.t0) {
      const ft = (t - flight.t0) / 900;
      const e = ft * ft;
      fx = rx + e * 60;
      fy = ry - e * (ry + 80);
      rScale = 1 + e * .4;
      // 尾跡
      ctx.strokeStyle = colors.flame; ctx.lineWidth = 2; ctx.globalAlpha = .5;
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    } else if (!reduced) {
      fy = ry + Math.sin(t / 400) * 2;
    }
    drawRocket(fx, fy, rAngle, rScale, t);

    // 進度條：距離起飛還差多少
    const prog = Math.max(0, Math.min(1, gain() / TARGET));
    ctx.fillStyle = colors.grid;
    ctx.fillRect(padL, H - 4, W - padL * 2, 2);
    ctx.fillStyle = colors.up;
    ctx.fillRect(padL, H - 4, (W - padL * 2) * prog, 2);

    requestAnimationFrame(frame);
  }

  seed();
  requestAnimationFrame(frame);
})();

// ---------- 動態背景：緩慢上升的半透明 K 棒 ----------
(() => {
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let up, down, grid;
  const readColors = () => { up = css('--up'); down = css('--down'); grid = css('--grid'); };
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readColors);

  let W, H, bars = [];
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(26, Math.max(12, W / 40)));
    bars = Array.from({ length: n }, () => make(Math.random() * H));
  }
  function make(y) {
    return {
      x: Math.random() * W,
      y,
      body: 14 + Math.random() * 34,
      wick: 6 + Math.random() * 14,
      w: 5 + Math.random() * 5,
      v: 6 + Math.random() * 14,           // 每秒上升像素
      a: .07 + Math.random() * .1,
      isUp: Math.random() < .78
    };
  }
  addEventListener('resize', resize);
  resize();

  let prev = performance.now();
  function draw(t) {
    const dt = Math.min(.05, (t - prev) / 1000); prev = t;
    ctx.clearRect(0, 0, W, H);

    // 淡淡的格線，緩慢往左捲動
    ctx.strokeStyle = grid; ctx.lineWidth = 1;
    const step = 48, off = reduced ? 0 : (t / 120) % step;
    for (let x = -off; x < W; x += step) {
      ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
    }

    bars.forEach((b, i) => {
      if (!reduced) b.y -= b.v * dt;
      if (b.y + b.body + b.wick < 0) bars[i] = b = make(H + 20);
      ctx.globalAlpha = b.a;
      ctx.fillStyle = ctx.strokeStyle = b.isUp ? up : down;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - b.wick); ctx.lineTo(b.x, b.y + b.body + b.wick); ctx.stroke();
      ctx.fillRect(b.x - b.w / 2, b.y, b.w, b.body);
    });
    ctx.globalAlpha = 1;

    if (!reduced) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
